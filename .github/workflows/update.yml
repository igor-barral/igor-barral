name: Update profile stats

on:
  schedule:
    - cron: '0 9 * * *' # daily, 06:00 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PROFILE_TOKEN: personal token with read access to private repos,
      # the default GITHUB_TOKEN only sees this repository.
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit if changed
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update profile stats"
          git push
